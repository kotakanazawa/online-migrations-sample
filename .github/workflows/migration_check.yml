name: Migration Check

on:
  pull_request:
    paths:
      - 'db/migrate/**'

permissions:
  pull-requests: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run migrations
        id: migrate
        continue-on-error: true
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:password@localhost:5432/online_migrations_sample_test
        run: bin/rails db:create db:migrate

      - name: Classify risk level
        id: classify
        if: steps.migrate.outcome == 'failure'
        run: |
          CHANGED_MIGRATIONS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- db/migrate/)
          HIGH_PATTERN="remove_column|drop_table|change_column|rename_column|force:[[:space:]]*true"
          if [ -n "$CHANGED_MIGRATIONS" ] && echo "$CHANGED_MIGRATIONS" | xargs grep -qE "$HIGH_PATTERN"; then
            echo "level=high" >> "$GITHUB_OUTPUT"
          else
            echo "level=middle" >> "$GITHUB_OUTPUT"
          fi

      - name: Add Risk High label
        if: ${{ steps.migrate.outcome == 'failure' && steps.classify.outputs.level == 'high' }}
        run: 'gh pr edit ${{ github.event.pull_request.number }} --add-label "Risk: High"'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Add Risk Middle label
        if: ${{ steps.migrate.outcome == 'failure' && steps.classify.outputs.level == 'middle' }}
        run: 'gh pr edit ${{ github.event.pull_request.number }} --add-label "Risk: Middle"'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Remove risk labels if migration passed
        if: steps.migrate.outcome == 'success'
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --remove-label "Risk: High" || true
          gh pr edit ${{ github.event.pull_request.number }} --remove-label "Risk: Middle" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fail if migration was unsafe
        if: steps.migrate.outcome == 'failure'
        run: exit 1
